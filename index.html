<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUESTLOGS - Gaming Gear & Satire Hub</title>
  <style>
    :root {
      --bg-dark: #0a071b;
      --card-bg: #140e33;
      --accent-purple: #8247ff;
      --accent-pink: #d946ef;
      --text-light: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2e2365;
      --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }

    header {
      background: rgba(10, 7, 27, 0.95);
      border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 1000;
      backdrop-filter: blur(10px);
    }
    .top-bar {
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
      color: #fff; text-align: center; font-size: 0.85rem; padding: 6px 15px; font-weight: 600;
    }
    .nav-container {
      max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;
    }
    .logo { font-size: 1.8rem; font-weight: 900; color: #fff; letter-spacing: 2px; }
    .logo span { color: var(--accent-pink); }
    
    nav { display: flex; gap: 1.5rem; align-items: center; }
    nav a { font-weight: 600; font-size: 0.95rem; color: var(--text-muted); padding: 6px 12px; border-radius: 6px; transition: 0.2s; }
    nav a:hover, nav a.active { color: #fff; background: var(--border-color); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      color: white; padding: 10px 20px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase;
    }
    .container { max-width: 1300px; margin: 0 auto; padding: 3rem 2rem; }
  </style>
</head>
<body>

  <div class="top-bar">🔥 MEGA SALE: Get 20% off all QuestLogs Pro Gear! Code: FASTFLATION20</div>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">QUEST<span>LOGS</span></a>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="shop.html">Equipment Shop</a>
        <a href="games.html">Satire Games</a>
        <a href="blog.html">Articles & News</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <section style="padding: 5rem 2rem; text-align: center;">
    <div class="container">
      <h1 style="font-size: 3.5rem; margin-bottom: 1rem;">Welcome to QUESTLOGS</h1>
      <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 2rem;">Explore pro gaming gear and interactive fast-food economic satire games.</p>
      <a href="shop.html" class="btn">Shop Hardware</a>
      <a href="games.html" class="btn" style="background: transparent; border: 1px solid var(--accent-purple); margin-left: 10px;">Play Satire Games</a>
    </div>
  </section>

</body>
</html>
