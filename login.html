<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - QUESTLOGS</title>
  <style>
    :root {
      --bg-dark: #0a071b;
      --card-bg: #140e33;
      --accent-purple: #8247ff;
      --accent-pink: #d946ef;
      --text-light: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2e2365;
      --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }

    header { background: rgba(10, 7, 27, 0.95); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
    .nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
    .logo { font-size: 1.8rem; font-weight: 900; color: #fff; display: flex; gap: 8px; }
    .logo span { color: var(--accent-pink); }
    nav { display: flex; gap: 1.5rem; align-items: center; }
    nav a { font-weight: 600; font-size: 0.95rem; color: var(--text-muted); padding: 6px 12px; border-radius: 6px; }

    footer { background: #05030f; border-top: 1px solid var(--border-color); margin-top: auto; padding: 3rem 2rem 1.5rem 2rem; }
    .footer-grid { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2.5rem; }
    .footer-col h4 { color: #fff; font-size: 1.1rem; margin-bottom: 1.2rem; border-left: 3px solid var(--accent-purple); padding-left: 8px; }
    .footer-col p { color: var(--text-muted); font-size: 0.9rem; }
    .footer-bottom { max-width: 1300px; margin: 0 auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

    .btn { display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; }
    .container { max-width: 480px; margin: 3rem auto; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">QUEST<span>LOGS</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Equipment Shop</a>
        <a href="games.html">Satire Games</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2.5rem;">
      <h2 style="color:#fff; font-size: 2rem; text-align:center; margin-bottom: 0.5rem;">Welcome Back</h2>
      <p style="color:var(--text-muted); text-align:center; margin-bottom: 2rem;">Sign in to your QuestLogs Member Account</p>

      <form onsubmit="alert('Successfully Logged In!'); window.location.href='index.html'; return false;">
        <div style="margin-bottom: 1.2rem;">
          <label style="display:block; color:#fff; font-weight:bold; margin-bottom:6px;">Email or Username</label>
          <input type="text" required placeholder="gamer@questlogs.com" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:#000; color:#fff;">
        </div>
        <div style="margin-bottom: 1.5rem;">
          <label style="display:block; color:#fff; font-weight:bold; margin-bottom:6px;">Password</label>
          <input type="password" required placeholder="••••••••" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:#000; color:#fff;">
        </div>
        <button class="btn" style="width:100%; padding:14px; margin-bottom: 1rem;">Sign In</button>
        <button type="button" class="btn" style="width:100%; padding:12px; background:transparent; border:1px solid var(--accent-purple);" onclick="alert('Registration Form Opened!');">Create New Account</button>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-grid">
      <div class="footer-col">
        <h4>QUESTLOGS HQ</h4>
        <p>📍 123 Quest Way, Suite 100, Austin, TX 78701<br>📞 (512) 555-0199</p>
      </div>
    </div>
    <div class="footer-bottom"><p>&copy; 2026 QuestLogs Media Inc.</p></div>
  </footer>
</body>
</html>
